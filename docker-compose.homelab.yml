services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mirage
      POSTGRES_USER: mirage
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mirage -d mirage"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1G
    logging:
      options:
        max-size: 10m
        max-file: "3"

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      PORT: 8080
      DATABASE_URL: jdbc:postgresql://postgres:5432/mirage
      DATABASE_USER: mirage
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
      CORS_ALLOWED_ORIGINS: http://${TAILSCALE_IP:?Set TAILSCALE_IP in .env}:8088
      SESSION_COOKIE_SECURE: "false"
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G
    logging:
      options:
        max-size: 10m
        max-file: "3"

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "${TAILSCALE_IP:?Set TAILSCALE_IP in .env}:8088:80"
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 128M
    logging:
      options:
        max-size: 10m
        max-file: "3"

volumes:
  postgres-data:
